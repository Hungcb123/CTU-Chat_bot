services:
  neo4j:
    image: neo4j:5.20.0
    container_name: graph_db_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graph_db_ingest
    depends_on:
      neo4j:
        condition: service_started
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password

volumes:
  neo4j_data:
  neo4j_logs:
